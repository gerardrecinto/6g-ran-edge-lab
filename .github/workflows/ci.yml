name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test
        run: make test
      - name: Smoke JSON output
        run: ./build/ranedge-sim --ticks 4 --json
      - name: Smoke telemetry output
        run: |
          ./build/ranedge-sim --ticks 8 --metrics | grep ranedge_alert_total
          ./build/ranedge-sim --ticks 8 --otel-logs | grep '"severity_text":"WARN"'
          ./build/ranedge-sim --ticks 8 --otel-traces | grep '"name":"ran.scheduler.tick"'
      - name: Smoke edge CPU budget flag
        run: ./build/ranedge-sim --ticks 4 --edge-cpu-budget 0.5 --json | grep edge-cpu-pressure
      - name: Reject invalid CLI input instead of crashing
        run: |
          ! ./build/ranedge-sim --ticks -5
          ! ./build/ranedge-sim --ticks 0
          ! ./build/ranedge-sim --edge-cpu-budget -1
